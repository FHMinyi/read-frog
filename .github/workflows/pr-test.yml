name: Test & Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  WXT_SKIP_ENV_VALIDATION: true
  SKIP_FREE_API: true
  RUN_LIVE_ANKI_CONNECT: false
  RUN_LIVE_ANKI_TTS: false

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Check for eruda imports
        run: |
          if grep -r "import.*eruda" src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" | grep -v ":.*[[:space:]]*//.*import.*eruda"; then
            echo "❌ Found uncommented eruda imports in the codebase!"
            echo "Please comment out or remove eruda imports before merging."
            exit 1
          else
            echo "✅ No uncommented eruda imports found."
          fi
        shell: bash

      - name: Format check
        run: pnpm exec nx fmt:check

      - name: Lint and type check
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test --exclude="**/free-api.test.ts"

      - name: Run native helper tests
        run: |
          pnpm test:dictionary-phonetic
          pnpm test:local-handoff
